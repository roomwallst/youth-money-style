name: Import Youth Money Style v3.2
on:
  push:
    branches: [main]
    paths: ['bundle/part07.txt']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original project text files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, bz2, json, pathlib
          parts=sorted(pathlib.Path('bundle').glob('part*.txt'))
          if len(parts)!=7: raise RuntimeError(f'Expected 7 parts, got {len(parts)}')
          packed=''.join(x.read_text(encoding='ascii') for x in parts)
          payload=bz2.decompress(base64.b64decode(packed,validate=True))
          files=json.loads(payload.decode('utf-8'))
          for name,content in files.items():
              path=pathlib.Path(name)
              if path.is_absolute() or '..' in path.parts: raise ValueError(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content,encoding='utf-8')
          print('Restored',len(files),'project files')
          PY
          rm -rf bundle
          rm -f .github/workflows/import-yms-v32.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Youth Money Style v3.2 website and sources'
          git push
